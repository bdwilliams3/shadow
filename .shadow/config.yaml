version: 1
providers:
  default:
    kind: openai-compatible
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
models:
  # Prices are USD per 1M tokens, checked 2026-09-05 against
  # https://developers.openai.com/api/docs/pricing
  # gpt-5.6-sol carries promotional pricing at least through 2026-11-21; re-check
  # before quoting any cost figure from a benchmark report generated after that.
  frontier:
    provider: default
    model: gpt-5.6-sol
    maxOutputTokens: 12000
    inputCostPerMillionTokens: 4.00
    outputCostPerMillionTokens: 20.00
  balanced:
    provider: default
    model: gpt-5.6-terra
    maxOutputTokens: 6000
    inputCostPerMillionTokens: 2.00
    outputCostPerMillionTokens: 12.00
  economy:
    provider: default
    model: gpt-5.6-luna
    maxOutputTokens: 3000
    inputCostPerMillionTokens: 0.20
    outputCostPerMillionTokens: 1.20
agents:
  # BRING-UP WINDOW: nothing may reach the `frontier` tier while the model-backed Plan
  # stage is being validated. Plan must produce correct stage graphs and acceptance
  # criteria across several green benchmark runs first, and a plan revision can now *add*
  # stages to the graph — so pinning only Plan would let Design or Document reintroduce
  # frontier spend by the back door.
  #
  # Develop is back on `balanced`, its §9 tier. Blanket-pinning every stage to `economy`
  # was stricter than the constraint requires and was costing signal rather than money:
  # in run 8 the economy model produced corrupt diffs on two mixed-service tasks that had
  # passed on the same configuration in runs 6 and 7, failing them inside Develop before
  # Test could run. That noise lands on exactly the runs meant to judge the planner.
  # `balanced` costs about ten times `economy` per input token and still spends nothing
  # on the frontier tier.
  #
  # Restore the full §9 mapping (plan/design frontier, develop/validate balanced,
  # test/deploy/document economy) as one deliberate change once Plan is proven; that flip
  # is what finally makes the benchmark's frontier-reduction gate measure a real ratio.
  # src/config/defaults.ts still carries the spec mapping; this file diverges on purpose.
  #
  # NOTE: this does not make a benchmark run cheap on its own. The single-frontier
  # baseline resolves models.frontier directly (src/benchmarks/baseline.ts), so it
  # ignores this mapping entirely. Use `--system shadow` to leave it out during bring-up.
  plan: economy
  design: economy
  develop: balanced
  test: economy
  validate: economy
  deploy: economy
  document: economy
budgets:
  run:
    maxInputTokens: 120000
    maxOutputTokens: 24000
    maxTotalTokens: 144000
    maxEstimatedCostUsd: 10
    reservedFrontierTokens: 20000
  stage:
    maxInputTokens: 40000
    maxOutputTokens: 8000
    maxTotalTokens: 48000
    maxEstimatedCostUsd: 3
    reservedFrontierTokens: 4000
  modelCall:
    maxInputTokens: 20000
    maxOutputTokens: 4000
    maxTotalTokens: 24000
    maxEstimatedCostUsd: 1
    reservedFrontierTokens: 0
lifecycle:
  enabledStages:
    - plan
    - design
    - develop
    - test
    - validate
    - deploy
    - document
  maxStageRetries: 1
  maxModelCallsPerStage: 3
approvals:
  allowWorkspaceWrites: true
  requireApprovalForDestructive: true
  requireApprovalForExternalWrites: true
  requireApprovalForNetwork: false
  requireApprovalForDeploy: true
persistence:
  runsDir: .shadow/runs
  artifactsDir: .shadow/artifacts
telemetry:
  localOnly: true
  remoteEnabled: false
