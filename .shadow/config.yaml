version: 1
providers:
  default:
    kind: openai-compatible
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
models:
  # Tier -> model. This is the knob: set each tier to whatever model you want to test
  # with, independently. Tiers may share a model; that is an ordinary configuration, not
  # a special mode. Output ceilings and prices are per-tier, so budget, reserve, and
  # routing logic behave differently even when the models are identical.
  #
  # Prices are USD per 1M tokens and are yours to set — they drive budget checks and the
  # reported cost figures, so they are only as accurate as what you put here.
  #
  # Production values, checked 2026-09-05 against
  # https://developers.openai.com/api/docs/pricing (frontier price promotional at least
  # through 2026-11-21):
  #   frontier gpt-5.6-sol   $4.00 / $20.00
  #   balanced gpt-5.6-terra $2.00 / $12.00
  #   economy  gpt-5.6-luna  $0.20 / $1.20
  frontier:
    provider: default
    model: gpt-5.6-sol
    maxOutputTokens: 12000
    inputCostPerMillionTokens: 4.00
    outputCostPerMillionTokens: 20.00
  balanced:
    provider: default
    model: gpt-5.5
    maxOutputTokens: 6000
    inputCostPerMillionTokens: 2.00
    outputCostPerMillionTokens: 12.00
  economy:
    provider: default
    model: gpt-5.4-mini
    maxOutputTokens: 3000
    inputCostPerMillionTokens: 0.20
    outputCostPerMillionTokens: 1.20
agents:
  # Spec §9 mapping. Which tier a stage asks for; the table above decides what that means.
  plan: balanced
  design: frontier
  develop: balanced
  test: economy
  validate: economy
  deploy: economy
  document: economy
budgets:
  run:
    maxInputTokens: 120000
    maxOutputTokens: 24000
    maxTotalTokens: 144000
    maxEstimatedCostUsd: 10
    reservedFrontierTokens: 20000
  stage:
    maxInputTokens: 40000
    maxOutputTokens: 8000
    maxTotalTokens: 48000
    maxEstimatedCostUsd: 3
    reservedFrontierTokens: 4000
  modelCall:
    maxInputTokens: 20000
    maxOutputTokens: 4000
    maxTotalTokens: 24000
    maxEstimatedCostUsd: 1
    reservedFrontierTokens: 0
lifecycle:
  enabledStages:
    - plan
    - design
    - develop
    - test
    - validate
    - deploy
    - document
  maxStageRetries: 1
  maxModelCallsPerStage: 3
approvals:
  allowWorkspaceWrites: true
  requireApprovalForDestructive: true
  requireApprovalForExternalWrites: true
  requireApprovalForNetwork: false
  requireApprovalForDeploy: true
persistence:
  runsDir: .shadow/runs
  artifactsDir: .shadow/artifacts
telemetry:
  localOnly: true
  remoteEnabled: false
