version: 1
providers:
  openai:
    kind: openai-compatible
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    models:
      gpt-6-astra:
        model: gpt-6-astra
        maxOutputTokens: 128000
        inputCostPerMillionTokens: 10.00
        outputCostPerMillionTokens: 50.00
        reservedBudget: true
      gpt-5-6-sol:
        model: gpt-5.6-sol
        maxOutputTokens: 12000
        inputCostPerMillionTokens: 4.00
        outputCostPerMillionTokens: 20.00
        reservedBudget: true
      gpt-5-6-luna:
        model: gpt-5.6-luna
        maxOutputTokens: 128000
        inputCostPerMillionTokens: 0.20
        outputCostPerMillionTokens: 1.20
      gpt-5-5:
        model: gpt-5.5
        maxOutputTokens: 6000
        inputCostPerMillionTokens: 2.00
        outputCostPerMillionTokens: 12.00
      gpt-5-4-mini:
        model: gpt-5.4-mini
        maxOutputTokens: 3000
        inputCostPerMillionTokens: 0.20
        outputCostPerMillionTokens: 1.20
  anthropic:
    kind: anthropic
    baseUrl: https://api.anthropic.com/v1
    apiKeyEnv: ANTHROPIC_API_KEY
    models:
      fable-5-1:
        model: fable-5.1
        maxOutputTokens: 120000
        inputCostPerMillionTokens: 3.00
        outputCostPerMillionTokens: 15.00
        reservedBudget: true
      opus-4-8:
        model: opus-4.8
        maxOutputTokens: 64000
        inputCostPerMillionTokens: 15.00
        outputCostPerMillionTokens: 75.00
        reservedBudget: true
      sonnet-4-6:
        model: sonnet-4.6
        maxOutputTokens: 64000
        inputCostPerMillionTokens: 3.00
        outputCostPerMillionTokens: 15.00
      haiku-4-5:
        model: haiku-4.5
        maxOutputTokens: 32000
        inputCostPerMillionTokens: 1.00
        outputCostPerMillionTokens: 5.00
  google:
    kind: google
    baseUrl: https://generativelanguage.googleapis.com/v1beta
    apiKeyEnv: GEMINI_API_KEY
    models:
      gemini-3-8:
        model: gemini-3.8
        maxOutputTokens: 64000
        inputCostPerMillionTokens: 2.00
        outputCostPerMillionTokens: 10.00
        reservedBudget: true
      gemini-3-8-flash:
        model: gemini-3.8-flash
        maxOutputTokens: 65536
        inputCostPerMillionTokens: 0.75
        outputCostPerMillionTokens: 3.75
        reservedBudget: true
      gemini-3-5-flash:
        model: gemini-3.5-flash
        maxOutputTokens: 65536
        inputCostPerMillionTokens: 1.50
        outputCostPerMillionTokens: 9.00
      gemini-3-1-pro-preview:
        model: gemini-3.1-pro-preview
        maxOutputTokens: 65536
        inputCostPerMillionTokens: 2.00
        outputCostPerMillionTokens: 12.00
        reservedBudget: true
      gemini-3-1-flash-lite:
        model: gemini-3.1-flash-lite
        maxOutputTokens: 65536
        inputCostPerMillionTokens: 0.25
        outputCostPerMillionTokens: 1.50
      gemini-2-5:
        model: gemini-2.5
        maxOutputTokens: 64000
        inputCostPerMillionTokens: 1.00
        outputCostPerMillionTokens: 5.00
      gemini-2-5-flash:
        model: gemini-2.5-flash
        maxOutputTokens: 65536
        inputCostPerMillionTokens: 0.30
        outputCostPerMillionTokens: 2.50
agents:
  chat: gemini-3-1-pro-preview
  plan: gpt-5.5
  design: gpt-5.6-luna
  develop: gpt-5.6-luna
  test: gemini-2-5-flash
  validate: gemini-3-1-pro-preview
  deploy: gpt-5.6-luna
  document: gemini-2-5-flash
budgets:
  run:
    maxInputTokens: 120000
    maxOutputTokens: 24000
    maxTotalTokens: 144000
    maxEstimatedCostUsd: 10
    reservedFrontierTokens: 20000
  stage:
    maxInputTokens: 40000
    maxOutputTokens: 8000
    maxTotalTokens: 48000
    maxEstimatedCostUsd: 3
    reservedFrontierTokens: 4000
  modelCall:
    maxInputTokens: 20000
    maxOutputTokens: 4000
    maxTotalTokens: 24000
    maxEstimatedCostUsd: 1
    reservedFrontierTokens: 0
lifecycle:
  enabledStages:
    - plan
    - design
    - develop
    - test
    - validate
    - deploy
    - document
  maxStageRetries: 1
  maxModelCallsPerStage: 3
approvals:
  allowWorkspaceWrites: true
  requireApprovalForDestructive: true
  requireApprovalForExternalWrites: true
  requireApprovalForNetwork: false
  requireApprovalForDeploy: true
persistence:
  runsDir: .shadow/runs
  artifactsDir: .shadow/artifacts
telemetry:
  localOnly: true
  remoteEnabled: false
