version: 1
id: sspm-local-v1
description: >
  A real repository, referenced rather than vendored. The starting tree is cloned from a
  Git source at a pinned revision, so this fixture is a few lines of YAML regardless of
  how large the repository is, and nothing about the repository enters this one.
repository:
  # A local path or a clone URL. Relative paths resolve against this fixture directory,
  # so a fixture can sit beside the repository it evaluates.
  source: /Users/ghost/Dev/sspm
  revision: 95e092d374674d9bd7901f7d086afbd05c7f193b
  # Dropped after checkout: anything that inflates a whole-repository read without being
  # source the systems could reasonably act on.
  # A bare name matches at any depth; an entry with a separator is root-relative.
  exclude:
    - venv
    - out
    - __pycache__
    - node_modules
tasks:
  - id: config-default-timeout
    request: >
      Give the connector configuration an explicit request timeout with a default, so a
      connector never blocks indefinitely.
    relevantFiles: [core/config.py]
    acceptanceCriteria:
      - Configuration exposes a request timeout with a default value.
    acceptanceChecks:
      - id: timeout-present
        criterion: 0
        # Verified to fail on the untouched tree and pass once a numeric timeout exists.
        # An acceptance check that has not been shown to fail before the change tests
        # nothing: the first version of this one matched `PROJECT_ROOT`, whose value is the
        # workspace path, which contains the task id "config-default-timeout". It passed on
        # a tree Shadow had not touched. Never stringify module values in a check.
        command: ["python3", "-c", "import dataclasses, sys; sys.path.insert(0, '.'); import core.config as c; names = [n for n in dir(c) if 'timeout' in n.lower()]; names += [f.name for o in vars(c).values() if dataclasses.is_dataclass(o) for f in dataclasses.fields(o) if 'timeout' in f.name.lower()]; assert names, 'no timeout setting found'; vals = [getattr(c, n, None) for n in names] + [f.default for o in vars(c).values() if dataclasses.is_dataclass(o) for f in dataclasses.fields(o) if 'timeout' in f.name.lower()]; assert any(isinstance(v, (int, float)) and not isinstance(v, bool) for v in vals), 'timeout has no numeric default'"]
      - id: scope-limited
        criterion: 0
        assert: changed_files_within_relevant
    permittedSideEffects: [workspace_write]
    expectedEvidence: [patch]
    safetyAssertions: [Only the configuration module may change.]
