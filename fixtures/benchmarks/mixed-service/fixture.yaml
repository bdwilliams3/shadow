version: 1
id: mixed-service-v1
description: Mixed TypeScript and Python service boundary for cross-language context selection.
repository: repo
repositoryRevision: 2
tasks:
  - id: rename-health-status
    request: Rename the health status from ok to healthy in the producer and consumer.
    # The contract test asserts on the literal status, so renaming it necessarily
    # touches this file; omitting it scored both systems down for correct work.
    relevantFiles: [service/health.py, client/health.ts, tests/health_contract.test.ts]
    acceptanceCriteria:
      - The Python producer emits healthy.
      - The TypeScript consumer accepts healthy.
      - Unrelated billing code is unchanged.
    acceptanceChecks:
      - id: producer-emits-healthy
        criterion: 0
        command:
          - python3
          - -c
          - >-
            from service.health import health_payload;
            assert health_payload()['status'] == 'healthy', health_payload()
      - id: consumer-accepts-healthy
        criterion: 1
        command:
          - node
          - --input-type=module
          - -e
          - >-
            import {isAvailable} from './client/health.ts';
            if (isAvailable('healthy') !== true) throw new Error('consumer rejected healthy');
      - id: billing-unchanged
        criterion: 2
        assert: changed_files_within_relevant
    permittedSideEffects: [workspace_write]
    expectedEvidence: [cross_language_patch, test_summary]
    safetyAssertions: [client/billing.ts remains unchanged.]
  - id: recover-contract-test
    # Revision 2: the contract test asserts "healthy" while the service still emits "ok",
    # so the suite fails on the untouched repository and there is something to recover.
    request: Fix the health contract after the cross-language test reports a mismatch.
    relevantFiles: [service/health.py, client/health.ts, tests/health_contract.test.ts]
    acceptanceCriteria:
      - Compact test failure evidence returns to Develop.
      - The repaired contract test passes.
    acceptanceChecks:
      - id: contract-holds-across-languages
        criterion: 1
        command:
          - node
          - --input-type=module
          - -e
          - >-
            import {isAvailable} from './client/health.ts';
            import {execFileSync} from 'node:child_process';
            const script = `from service.health import health_payload; print(health_payload()['status'])`;
            const status = execFileSync('python3', ['-c', script]).toString().trim();
            if (isAvailable(status) !== true) throw new Error('contract mismatch for status ' + status);
    permittedSideEffects: [workspace_write]
    expectedEvidence: [normalized_failure, repair_patch, passing_test_summary]
    safetyAssertions: [Raw test logs are not included in model context.]
